[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplecrawl"
version = "0.1.0"
description = "Rule-driven crawler: one small file per site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crawlee[parsel,playwright]>=1.11.1",
    "cryptography>=43.0",
    "httpx[http2]>=0.28",
]

[project.optional-dependencies]
playwright = ["playwright>=1.60"]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["simplecrawl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["_legacy", ".git", ".idea", "data", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
